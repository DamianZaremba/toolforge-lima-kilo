---
kind:
  # refresh versions from https://github.com/kubernetes-sigs/kind/releases
  url:
    amd64: https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
    arm64: https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-arm64
  checksum:
    amd64: sha256:eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
    arm64: sha256:20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2

  unpack: false
  extra_forward_ports:
    - 30000 # istio tool gateway
    - 30003 # api-gateway
    - 30004 # infra-tracing-loki
  cluster:
    name: toolforge
    images:
      1_34:
        name: kindest/node:v1.34.11
        checksum: sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
      # add more if you plan to run multiple versions
      # ...
  api:
    port: 6443
    # toolforge- prefix is because cluster name is toolforge.
    hostname: toolforge-control-plane
    # this is the default for multi control-node kind clusters.
    ha_hostname: toolforge-external-load-balancer

  files:
    config:
      path: "{{ ansible_facts['env']['HOME'] }}/kind.yaml"
      src: kind.yaml.j2
    containerd_hosts_config:
      path: /etc/containerd/certs.d/_default/hosts.toml
      src: hosts.toml.j2

nodes:
  - name: toolforge-control-plane
    role: control-plane
    image: "{{ kind.cluster.images.1_34.name }}@{{ kind.cluster.images.1_34.checksum }}"
    active: "true" # default
  - name: toolforge-control-plane2
    role: control-plane
    image: "{{ kind.cluster.images.1_34.name }}@{{ kind.cluster.images.1_34.checksum }}"
    active: "{{ kind_high_availability }}"
  - name: toolforge-control-plane3
    role: control-plane
    image: "{{ kind.cluster.images.1_34.name }}@{{ kind.cluster.images.1_34.checksum }}"
    active: "{{ kind_high_availability }}"
  - name: toolforge-worker
    role: worker
    image: "{{ kind.cluster.images.1_34.name }}@{{ kind.cluster.images.1_34.checksum }}"
    active: "{{ kind_high_availability }}"

kind_high_availability: "false"
tool_account_kubeconfig_server_url: "https://{{ kind.api.hostname }}:{{ kind.api.port }}"
