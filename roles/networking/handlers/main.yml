---
- name: Reload wg-ipv6-tunnel to pickup change
  become: true
  ansible.builtin.systemd_service:
    name: wg-ipv6-tunnel.service
    state: reloaded
  when: enable_ipv6_tunnel | bool

- name: Restart wg-ipv6-tunnel to pickup change
  become: true
  ansible.builtin.systemd_service:
    name: wg-ipv6-tunnel.service
    daemon_reload: true
    state: restarted
  when: enable_ipv6_tunnel | bool
